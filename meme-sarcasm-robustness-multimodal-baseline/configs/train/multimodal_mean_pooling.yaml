# Ablation: masked mean pooling over DistilBERT tokens instead of [CLS].
#   python -m src.models.trainer --config configs/train/multimodal_mean_pooling.yaml
task: multimodal
model_name: distilbert_meanpool_clip_frozen
modalities: [text, image]

text_model_id: distilbert/distilbert-base-uncased
text_revision: 1c4513b2eedbda136f57676a34eea67aba266e5c
text_feature: mean_pooling      # first_token = DistilBERT [CLS] position; mean_pooling = ablation
text_max_length: 128
clip_model_id: openai/clip-vit-base-patch32
clip_revision: 3d74acf
image_feature: pooler_output
normalize_embeddings: true      # L2-normalize each modality before concatenation

features:
  text: data/processed/features/distilbert_mean_pooling        # feature_engineering text
  image: data/processed/features/20261006_code_fixes_validation_v2   # image group's cache

fusion:
  input_dim: 1536
  hidden_dim: 512
  dropout: 0.2
  num_classes: 2

seed: 42
threshold: 0.5          # fixed (README 3.2); never tuned
loss: weighted_cross_entropy   # class weights from TRAIN only (README 5.2)
optimizer: adamw
lr: 0.001
weight_decay: 0.0001
batch_size: 16
epochs: 30              # best epoch kept by validation Macro-F1
